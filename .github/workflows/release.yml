name: ScalaAPI Paired Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: scalaapi-paired-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Complete paired CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-metadata:
    name: Validate release identity
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      superproject_sha: ${{ steps.metadata.outputs.superproject_sha }}
      platform_sha: ${{ steps.metadata.outputs.platform_sha }}
      gateway_sha: ${{ steps.metadata.outputs.gateway_sha }}
      contract_digest: ${{ steps.metadata.outputs.contract_digest }}
      migration_digest: ${{ steps.metadata.outputs.migration_digest }}
    steps:
      - name: Check out the release pair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate the superproject release tag
        run: scripts/validate-release-tag.sh "$GITHUB_REF_NAME"

      - name: Generate release pair manifest
        run: scripts/generate-pair-manifest.sh "$RUNNER_TEMP/pair-manifest.json"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to republish an existing release tag
        run: scripts/validate-release-images.sh "$GITHUB_REF_NAME"

      - name: Export immutable metadata
        id: metadata
        run: |
          {
            echo "superproject_sha=$(jq -r '.superproject.commit' "$RUNNER_TEMP/pair-manifest.json")"
            echo "platform_sha=$(jq -r '.components.platform.commit' "$RUNNER_TEMP/pair-manifest.json")"
            echo "gateway_sha=$(jq -r '.components.gateway.commit' "$RUNNER_TEMP/pair-manifest.json")"
            echo "contract_digest=$(jq -r '.contract.digest' "$RUNNER_TEMP/pair-manifest.json")"
            echo "migration_digest=$(jq -r '.migrations.digest' "$RUNNER_TEMP/pair-manifest.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release pair manifest
        uses: actions/upload-artifact@v4
        with:
          name: scalaapi-release-pair-${{ github.ref_name }}
          path: ${{ runner.temp }}/pair-manifest.json
          if-no-files-found: error
          retention-days: 90

  build-images:
    name: Build ${{ matrix.key }} image
    needs: release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: gateway
            component: gateway
            context: ./gateway
            dockerfile: ./gateway/Dockerfile
            target: runtime
          - key: platform
            component: platform
            context: ./platform
            dockerfile: ./platform/Dockerfile
            target: platform-silo
          - key: admin-api
            component: platform
            context: ./platform
            dockerfile: ./platform/Dockerfile
            target: admin-api
          - key: migrator
            component: platform
            context: ./platform
            dockerfile: ./platform/Dockerfile
            target: migrate
          - key: provider-mock
            component: platform
            context: ./platform
            dockerfile: ./platform/Dockerfile
            target: provider-mock
    steps:
      - name: Check out the release pair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the release image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=scalaapi-${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=scalaapi-${{ matrix.key }}

  publish-images:
    name: Publish release images
    needs: [release-metadata, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      SUPERPROJECT_SHA: ${{ needs.release-metadata.outputs.superproject_sha }}
      PLATFORM_SHA: ${{ needs.release-metadata.outputs.platform_sha }}
      GATEWAY_SHA: ${{ needs.release-metadata.outputs.gateway_sha }}
      CONTRACT_DIGEST: ${{ needs.release-metadata.outputs.contract_digest }}
      MIGRATION_DIGEST: ${{ needs.release-metadata.outputs.migration_digest }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release pair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish every release image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-metadata"

          publish_image() {
            local key="$1"
            local component="$2"
            local context="$3"
            local dockerfile="$4"
            local target="$5"
            local repository="$6"
            local component_sha
            case "$component" in
              platform) component_sha="$PLATFORM_SHA" ;;
              gateway) component_sha="$GATEWAY_SHA" ;;
              *) echo "unknown component: $component" >&2; return 1 ;;
            esac

            echo "Publishing $repository:$RELEASE_TAG"
            local metadata_file="$RUNNER_TEMP/build-metadata-$key.json"
            docker buildx build \
              --file "$dockerfile" \
              --target "$target" \
              --tag "$repository:$RELEASE_TAG" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=$SUPERPROJECT_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --label "io.scalaapi.component=$component" \
              --label "io.scalaapi.component.revision=$component_sha" \
              --label "io.scalaapi.platform.revision=$PLATFORM_SHA" \
              --label "io.scalaapi.gateway.revision=$GATEWAY_SHA" \
              --label "io.scalaapi.contract.digest=sha256:$CONTRACT_DIGEST" \
              --label "io.scalaapi.migrations.digest=sha256:$MIGRATION_DIGEST" \
              --cache-from "type=gha,scope=scalaapi-$key" \
              --metadata-file "$metadata_file" \
              --push \
              "$context"

            local digest
            digest="$(jq -r '."containerimage.digest"' "$metadata_file")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "registry did not report a valid digest for $key: $digest" >&2
              return 1
            }

            jq -n \
              --arg repository "$repository" \
              --arg tag "$RELEASE_TAG" \
              --arg reference "$repository:$RELEASE_TAG" \
              --arg digest "$digest" \
              --arg component "$component" \
              --arg component_commit "$component_sha" \
              --arg superproject_commit "$SUPERPROJECT_SHA" \
              --arg contract_digest "$CONTRACT_DIGEST" \
              --arg migration_digest "$MIGRATION_DIGEST" \
              --arg dockerfile "$dockerfile" \
              --arg target "$target" \
              '{
                repository: $repository,
                tag: $tag,
                reference: $reference,
                digest: $digest,
                component: $component,
                component_commit: $component_commit,
                superproject_commit: $superproject_commit,
                contract_digest: $contract_digest,
                migration_digest: $migration_digest,
                build: {dockerfile: $dockerfile, target: $target}
              }' > "$RUNNER_TEMP/image-metadata/$key.json"
          }

          publish_image gateway gateway ./gateway ./gateway/Dockerfile runtime ghcr.io/gmorandi/scalaapi-gateway
          publish_image platform platform ./platform ./platform/Dockerfile platform-silo ghcr.io/gmorandi/scalaapi-platform
          publish_image admin-api platform ./platform ./platform/Dockerfile admin-api ghcr.io/gmorandi/scalaapi-admin-api
          publish_image migrator platform ./platform ./platform/Dockerfile migrate ghcr.io/gmorandi/scalaapi-migrator
          publish_image provider-mock platform ./platform ./platform/Dockerfile provider-mock ghcr.io/gmorandi/scalaapi-provider-mock

          test "$(find "$RUNNER_TEMP/image-metadata" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 5

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: scalaapi-release-images-${{ github.ref_name }}
          path: ${{ runner.temp }}/image-metadata/*.json
          if-no-files-found: error
          retention-days: 90

  release-evidence:
    name: Assemble release evidence
    needs: [release-metadata, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Check out the release pair
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Recreate the validated pair manifest
        run: |
          scripts/validate-release-tag.sh "$GITHUB_REF_NAME"
          scripts/generate-pair-manifest.sh "$RUNNER_TEMP/pair-manifest.json"

      - name: Download registry image metadata
        uses: actions/download-artifact@v4
        with:
          name: scalaapi-release-images-${{ github.ref_name }}
          path: ${{ runner.temp }}/image-metadata

      - name: Collect the producing run's gate conclusions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/collect-gate-results.sh --output "$RUNNER_TEMP/gates.json"

      - name: Generate release evidence
        run: >-
          scripts/generate-release-evidence.sh
          --version "$GITHUB_REF_NAME"
          --pair-manifest "$RUNNER_TEMP/pair-manifest.json"
          --images-dir "$RUNNER_TEMP/image-metadata"
          --gates-json "$RUNNER_TEMP/gates.json"
          --output "$RUNNER_TEMP/release-evidence.json"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: scalaapi-release-evidence-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/pair-manifest.json
          if-no-files-found: error
          retention-days: 90
